<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist Harian</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#000;--card:#0e0e0e;--ink:#f2f2f2;--mute:#9a8f8f;--line:#2a1a1a;--acc:#d32f2f;--accsoft:#2a0f0f;--danger:#ff6b5b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Times New Roman",serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:56px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;cursor:pointer;text-align:center}
.day small{display:block;color:var(--mute);font-size:11px}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day.on small{color:#ffd9d9}
.day.full:not(.on){background:var(--accsoft);border-color:var(--acc)}
.add{border-style:dashed;color:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:0 0 auto}
li label{flex:1;cursor:pointer}
li.done label{color:var(--mute);text-decoration:line-through}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:0 4px}
.x:hover{color:var(--danger)}
.form{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.form input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:14px}
button.p{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.s{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Checklist Harian</h1>
  <p class="sub">Satu hari, satu daftar. Centang kalau sudah selesai.</p>
  <div class="days" id="days"></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="stat"><span id="count"></span><span id="streak"></span></div>
  <ul id="list"></ul>
  <div class="form">
    <input type="text" id="newTask" placeholder="Tambah kegiatan baru..." maxlength="80">
    <div class="row">
      <label><input type="checkbox" id="toAll" checked> Tambahkan ke semua hari</label>
      <button class="p" id="addBtn" style="margin-left:auto">Tambah</button>
    </div>
  </div>
  <div class="tools">
    <button class="s" id="reset">Kosongkan centang hari ini</button>
    <button class="s" id="exp">Ekspor cadangan</button>
    <button class="s" id="imp">Impor cadangan</button>
    <button class="s" id="wipe">Hapus semua data</button>
  </div>
</div>
<script>
const KEY="checklist-harian-v1";
const DEFAULTS=["Sholat tahajud","Baca Al-Quran","Sholat subuh","Makan siang","Sholat zuhur","Sholat asar","Lari","Gym","Makan malam","Sholat maghrib","Sholat isya","Belajar","Push up 50","Pull up 30","Sit up 50","Tidur"];
let S=null,cur=0;
const $=id=>document.getElementById(id);
const mk=t=>({t,d:false});
function fresh(){return{days:Array.from({length:30},()=>({tasks:DEFAULTS.map(mk)}))}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):null}catch(e){S=null}
  if(!S||!Array.isArray(S.days)||!S.days.length)S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const full=d=>d.tasks.length>0&&d.tasks.every(x=>x.d);
function render(){
  $("days").innerHTML="";
  S.days.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="day"+(i===cur?" on":"")+(full(d)?" full":"");
    b.innerHTML="Hari "+(i+1)+"<small>"+d.tasks.filter(x=>x.d).length+"/"+d.tasks.length+"</small>";
    b.onclick=()=>{cur=i;render()};
    $("days").appendChild(b);
  });
  const a=document.createElement("button");
  a.className="day add";a.textContent="+ Hari";
  a.onclick=()=>{S.days.push({tasks:S.days[S.days.length-1].tasks.map(x=>mk(x.t))});cur=S.days.length-1;save();render();$("days").scrollLeft=1e5};
  $("days").appendChild(a);
  const d=S.days[cur],done=d.tasks.filter(x=>x.d).length;
  $("fill").style.width=(d.tasks.length?done/d.tasks.length*100:0)+"%";
  $("count").textContent=done+" dari "+d.tasks.length+" selesai";
  let s=0;for(let i=S.days.length-1;i>=0;i--){if(full(S.days[i]))s++;else if(s>0||i<S.days.length-1)break}
  let run=0,best=0;S.days.forEach(x=>{run=full(x)?run+1:0;best=Math.max(best,run)});
  $("streak").textContent="Rekor beruntun: "+best+" hari";
  const ul=$("list");ul.innerHTML="";
  d.tasks.forEach((t,i)=>{
    const li=document.createElement("li");if(t.d)li.className="done";
    const id="t"+i;
    li.innerHTML='<input type="checkbox" id="'+id+'"'+(t.d?" checked":"")+'><label for="'+id+'"></label><button class="x" aria-label="Hapus">×</button>';
    li.querySelector("label").textContent=t.t;
    li.querySelector("input").onchange=e=>{t.d=e.target.checked;save();render()};
    li.querySelector(".x").onclick=()=>{
      if(!confirm("Hapus \""+t.t+"\" dari hari ini"+(S.days.length>1?" (dan semua hari lain yang sama)":"")+"?"))return;
      S.days.forEach((dd,di)=>{if(di===cur){dd.tasks.splice(i,1)}else{const k=dd.tasks.findIndex(y=>y.t===t.t);if(k>-1)dd.tasks.splice(k,1)}});
      save();render()};
    ul.appendChild(li);
  });
}
function add(){
  const v=$("newTask").value.trim();if(!v)return;
  if($("toAll").checked)S.days.forEach(d=>d.tasks.push(mk(v)));else S.days[cur].tasks.push(mk(v));
  $("newTask").value="";save();render();
}
$("addBtn").onclick=add;
$("newTask").onkeydown=e=>{if(e.key==="Enter")add()};
$("reset").onclick=()=>{S.days[cur].tasks.forEach(t=>t.d=false);save();render()};
$("wipe").onclick=()=>{if(confirm("Semua data dihapus dan kembali ke daftar awal. Lanjut?")){S=fresh();cur=0;save();render()}};
$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
  a.download="checklist-harian-cadangan.json";a.click();
};
$("imp").onclick=()=>{
  const i=document.createElement("input");i.type="file";i.accept=".json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.days)||!o.days.length)throw 0;S=o;cur=0;save();render()}catch(e){alert("File cadangan tidak valid.")}};
    r.readAsText(f)};
  i.click();
};
load();render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
